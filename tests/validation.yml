models:
  - name: t_customer
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: t_order
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('t_customer')
                field: customer_id